<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last Light, the sewers, 2D</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f0e; }
      canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
      #rats, #top { pointer-events: none; }
      #hud, #splits {
        position: fixed; top: 8px; white-space: pre;
        font: 12px/1.45 ui-monospace, monospace; color: #c9d1cc;
        text-shadow: 0 1px 2px #000; pointer-events: none;
      }
      #hud { left: 10px; }
      #splits { right: 10px; text-align: right; }
      #said {
        position: fixed; left: 0; right: 0; bottom: 44px; text-align: center;
        font: italic 20px/1.4 Georgia, serif; color: #f1e6d2; text-shadow: 0 2px 6px #000;
        pointer-events: none;
      }
      #keys {
        position: fixed; left: 10px; right: 270px; bottom: 8px; font: 12px/1.4 ui-monospace, monospace;
        color: #8a9188; pointer-events: none;
      }
      #life {
        position: fixed; left: 10px; bottom: 50px; width: 220px; height: 12px;
        background: #0b0f0ecc; border: 1px solid #3a4440; border-radius: 3px; pointer-events: none;
      }
      #life .fill { height: 100%; width: 100%; border-radius: 2px; }
      #life span {
        position: absolute; left: 0; top: -17px; font: 12px ui-monospace, monospace; color: #c9d1cc;
        text-shadow: 0 1px 2px #000;
      }
      #legend {
        position: fixed; right: 10px; top: 210px; max-width: 330px; padding: 6px 9px;
        font: 11px/1.45 ui-monospace, monospace; color: #c9d1cc; background: #0b0f0ecc;
        border: 1px solid #3a4440; border-radius: 4px; pointer-events: none;
      }
      #legend span { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; vertical-align: -1px; }
      #follow {
        position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
        font: 12px ui-monospace, monospace; color: #c9d1cc; background: #0b0f0ecc;
        border: 1px solid #3a4440; border-radius: 4px; padding: 4px 10px; cursor: pointer;
      }
      #end {
        display: none; position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
        white-space: pre; text-align: center; font: 18px/1.6 Georgia, serif; color: #f1e6d2;
        background: #000c; padding: 20px 28px; border-radius: 8px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="plan"></canvas>
    <canvas id="rats"></canvas>
    <canvas id="top"></canvas>
    <div id="hud"></div>
    <div id="splits"></div>
    <div id="said"></div>
    <div id="end"></div>
    <div id="legend"></div>
    <div id="life"><span>life</span><div class="fill"></div></div>
    <button id="follow">follow: on (F)</button>
    <div id="keys">WASD / ZQSD walk · Shift run · Space light at a flame, pull, pick up, press (hold) · R start again · 0-5 skip · P pause · V see everything · O designer overlay · K legend · L endless light · G torch panel · drag pan · wheel zoom · F, double click or the button: follow on/off</div>
    <script type="module" src="./src/sewers2d.prototype.ts"></script>
  </body>
</html>

# Every pull request and every push to main runs the same three commands a
# contributor runs locally: typecheck, test, build. A red run blocks the merge.
#
# What is deliberately *not* here: the cross-path pixel-diff gate (`node release/parity/check.mjs`).
# It needs a real GPU on both a WebGL and a WebGPU backend, and headless WebGPU
# is not a dependable CI target — a flaky gate is a gate that gets disabled. So
# it is a required manual step before publishing instead (docs/releasing.md), and
# the pure half of it — the comparison and the verdict — runs here with the rest
# of the root suite, which is where the gate lives (ADR-0011 amendment).
#
# Scope is the whole pnpm workspace: one install covers the library and the
# examples package, and both packages' typecheck and tests have to be green to
# merge. Only the library is built here — the demo's `vite build` needs a newer
# node than the floor this matrix pins, and it ships to Pages, not to npm.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run's answer irrelevant. Runs on main
# are never cancelled — each commit there wants its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines` declares, and the version contributors actually
        # run — a break that only shows on one of the two still fails CI.
        node: [18, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Soldier.glb is gitignored and fetched on demand; without this step the
      # skinned integration tests would skip and CI would go green having
      # never baked the real character (docs/test-assets.md). The fetch is
      # pinned by SHA-256, so the script's own contents are an exact cache key:
      # re-pin the asset and the key changes with it.
      - uses: actions/cache@v6
        with:
          path: test-assets
          key: test-assets-${{ hashFiles('scripts/fetch-test-assets.mjs') }}

      # Still runs on a cache hit: the script verifies the digest of what it
      # finds and only downloads when that fails.
      - run: node scripts/fetch-test-assets.mjs

      # All three tsconfigs, behind one verb. The release suite — the parity gate
      # and the packaging and deployment checks — is browser code with a
      # `vite/client` type surface, so it is typechecked apart from the library,
      # whose tsconfig declares `types: []`; and the demo is the library's first
      # consumer, with the crowd-layout tests living there, so it carries its own.
      - run: pnpm typecheck

      # No GPU on the runner: the baker is CPU math and the decode tests stub
      # the renderer, so the whole suite runs headless. Every suite is behind this
      # one verb: the library's, the release suite in `release/` — the packaging
      # and deployment checks, and the pure half of the parity gate — and the
      # demo's own, where the crowd-layout non-overlap guarantee and the WebGPU
      # support probe live.
      - run: pnpm test

      # The published artifact has to build from the same tree that just
      # passed — a type-level green with a broken bundle is still broken.
      - run: pnpm build

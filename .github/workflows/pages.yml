# The demos, deployed. Every push to main publishes examples/ to GitHub Pages,
# so the README can link a running crowd instead of asking a stranger to clone
# the repository (ADR-0011).
#
# Separate from ci.yml on purpose: CI's job is a verdict on a commit and runs on
# every pull request across a node matrix; this one's job is to put a build
# online, only from the default branch, on one node. CI still builds and tests
# the tree — a red CI and a green deploy of the same commit is possible, and
# preferable to a demo that stops shipping because an unrelated matrix leg broke.
#
# One step this file cannot do for itself: the repository must have a Pages site
# whose source is GitHub Actions, created once by an admin — Settings -> Pages ->
# Source, or `gh api --method POST repos/<owner>/<repo>/pages -f build_type=workflow`.
# Done for this repository; a fork has to do it again. `configure-pages` offers
# `enablement: true` for exactly this and it does not work: creating a Pages site
# is an admin-scoped call, and the workflow's GITHUB_TOKEN is not admin however
# its permissions are set ("Resource not accessible by integration"). Until the
# site exists the build job fails on `configure-pages` with a 404.
# `workflow_dispatch` republishes the current main without waiting for a commit.
name: Deploy demos

on:
  push:
    branches: [main]
  # Re-publish the current main without a commit — after fixing an asset, say.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # The deploy step authenticates to Pages with an OIDC token, not a PAT.
  id-token: write

# One deploy at a time, and never cancelled: a cancelled run would leave the
# site on whichever build happened to finish last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # 22, not the 18 floor CI pins: that floor is the library's `engines`
      # promise to consumers, and vite 7 needs newer than it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # One workspace install covers the library source the demo imports
      # through its public specifiers (examples/vite.config.ts).
      - run: pnpm install --frozen-lockfile

      - run: pnpm build:examples

      - uses: actions/configure-pages@v6

      # The built multi-page app: index.html plus one page per renderer, all
      # relative-linked, which is what lets them live under /three-vat/.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

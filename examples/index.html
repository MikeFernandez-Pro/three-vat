<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-vat — examples</title>
    <meta
      name="description"
      content="Every three-vat example: baked vertex animation textures driving instanced crowds, one page per feature per renderer, on WebGL and WebGPU."
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto+Mono:400,500,700&display=swap" />
    <style>
      /* threejs.org/examples, in the dark: the site's own variables (files/main.css,
         its `prefers-color-scheme: dark` values) taken as the only scheme, so the
         gallery is the same page whatever the visitor's system says — and the
         same room the example pages are in (ADR-0024). */
      :root {
        color-scheme: dark;
        --background-color: #222;
        --secondary-background-color: #2e2e2e;
        --color-blue: #049ef4;
        --text-color: #bbb;
        --secondary-text-color: #666;
        --font-size: 16px;
        --line-height: 26px;
        --border-color: #444;
        --border-style: 1px solid var(--border-color);
        --header-height: 48px;
        --panel-width: 300px;
        --panel-padding: 16px;
      }
      * { box-sizing: border-box; }
      html { font-size: calc(var(--font-size) - 1px); line-height: calc(var(--line-height) - 1px); }
      body {
        margin: 0; height: 100vh; display: flex;
        font-family: 'Roboto Mono', monospace;
        color: var(--text-color); background-color: var(--background-color);
      }
      a { color: var(--text-color); text-decoration: none; }
      a:hover { color: var(--color-blue); }

      /* ------------------------------------------------------------ sidebar */
      /* three's `#panel`: a fixed-width column with its own scroll, so a list
         that grows past the viewport scrolls inside it rather than pushing the
         example off screen. */
      #sidebar {
        flex: 0 0 var(--panel-width); display: flex; flex-direction: column;
        border-right: var(--border-style); overflow: hidden;
      }
      #masthead {
        display: flex; flex-direction: column; justify-content: center;
        min-height: var(--header-height); padding: 12px var(--panel-padding);
        border-bottom: var(--border-style);
      }
      #masthead h1 { margin: 0; font-size: 1rem; font-weight: 700; color: var(--text-color); }
      #masthead p { margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: var(--secondary-text-color); }
      #masthead a { color: var(--text-color); }
      #masthead a:hover { color: var(--color-blue); }

      /* The generated list (gallery.mjs) — the filter, then one entry per page
         in the page table. Nothing in here is written by hand: this element is
         empty as authored and the sidebar is stamped into it as the shell is
         served, so a page added to the folder appears with no list edited. */
      #examples { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 0 var(--panel-padding); }
      #filter { display: flex; gap: 6px; padding: 0 var(--panel-padding) 12px; }
      #filter button {
        flex: 1; padding: 4px 0; font: inherit; font-size: 12px; cursor: pointer; text-transform: uppercase;
        color: var(--text-color); background: var(--secondary-background-color);
        border: var(--border-style); border-radius: 4px;
      }
      #filter button:hover { color: var(--color-blue); }
      #filter button[aria-pressed="true"] { color: var(--color-blue); border-color: var(--color-blue); }
      #examples ul { margin: 0; padding: 0; list-style: none; }
      #examples li { margin: 1px 0; }
      #examples a { display: block; padding: 2px var(--panel-padding); color: var(--text-color); }
      #examples a:hover, #examples a[aria-current="page"] { color: var(--color-blue); }
      #examples a[aria-current="page"] { text-decoration: underline; }
      #examples .renderer { color: var(--secondary-text-color); margin-right: 6px; }
      #examples a:hover .renderer, #examples a[aria-current="page"] .renderer { color: inherit; }

      /* ------------------------------------------------------------- stage */
      /* The iframe frames a page, it does not own one: every example works
         opened at its own address, and nothing here is chrome it depends on.
         Black behind it, so the example's own black is there before it loads. */
      #frame { flex: 1; border: 0; width: 100%; height: 100%; background: #000; }

      /* Phone width: the sidebar stops being a column and becomes a short strip
         above the example, capped so it can never take more than a third of the
         screen however long the list gets. */
      @media (max-width: 700px) {
        body { flex-direction: column; }
        #sidebar { flex: 0 0 auto; max-height: 34vh; border-right: 0; border-bottom: var(--border-style); }
        #masthead { padding: 10px 12px; }
        #masthead p { display: none; }
        #examples { padding: 8px 0; }
        #examples a { padding: 3px 12px; }
        #filter { padding: 0 12px 8px; }
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div id="masthead">
        <h1>three-vat</h1>
        <p>
          Animation clips baked into a texture and played back on the GPU.
          <a href="https://github.com/MikeFernandez-Pro/three-vat">Source and docs →</a>
        </p>
      </div>
      <!-- Empty as authored, and filled as the shell is served: the sidebar is
           generated from the page table (gallery.mjs, ADR-0020). A list written
           here would be the menu that grows one anchor at a time, and the shell
           would be the one place a new page could be forgotten. -->
      <nav id="examples" aria-label="examples"></nav>
    </div>
    <iframe id="frame" title="the example you picked"></iframe>

    <script type="module">
      // The shell's own behaviour: which example is framed, and which renderer
      // the list is narrowed to. Both read the sidebar rather than a list of
      // their own — the pages are the generated anchors' `data-page`, and the
      // default is whichever anchor the generator marked current — so this
      // script never has to be edited when a page lands.
      const frame = document.getElementById('frame')
      const links = [...document.querySelectorAll('#examples a[data-page]')]
      const rows = [...document.querySelectorAll('#examples li')]
      const buttons = [...document.querySelectorAll('#filter button')]

      /** The example the gallery opens on: the one the sidebar came marked as current. */
      const fallback = links.find((a) => a.getAttribute('aria-current') === 'page')?.dataset.page

      // The framed example lives in the URL, so a link into the gallery is
      // shareable and the back button walks the examples someone looked at.
      const framed = () => {
        const wanted = decodeURIComponent(location.hash.slice(1))
        return links.some((a) => a.dataset.page === wanted) ? wanted : fallback
      }

      function show() {
        const name = framed()
        if (name === undefined) return
        const src = `${name}.html`
        // Guarded, so a re-render for any other reason does not reload the
        // example and throw away the crowd it has already baked.
        if (!frame.src.endsWith(`/${src}`)) frame.src = src
        for (const a of links) {
          if (a.dataset.page === name) a.setAttribute('aria-current', 'page')
          else a.removeAttribute('aria-current')
        }
      }

      for (const a of links) {
        a.addEventListener('click', (event) => {
          // Only the plain left click: a middle click, a modified click or a
          // right click still opens the example at its own address, which it
          // is built to work at.
          if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return
          event.preventDefault()
          location.hash = a.dataset.page
        })
      }

      for (const button of buttons) {
        button.addEventListener('click', () => {
          const wanted = button.dataset.renderer
          for (const other of buttons) other.setAttribute('aria-pressed', String(other === button))
          for (const row of rows) row.hidden = wanted !== '' && row.dataset.renderer !== wanted
        })
      }

      addEventListener('hashchange', show)
      show()
    </script>
  </body>
</html>

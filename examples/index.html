<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-vat — examples</title>
    <meta
      name="description"
      content="Every three-vat example: baked vertex animation textures driving instanced crowds, one example per feature, each on WebGL and on WebGPU."
    />
    <!-- The studio's tokens (ADR-0037): the same stylesheet the examples link,
         so the shell and what it frames are one room. -->
    <link rel="stylesheet" href="./src/theme.css" />
    <style>
      :root { --panel-width: 264px; }
      body { height: 100vh; display: flex; }

      /* ------------------------------------------------------------ sidebar */
      /* A fixed-width column with its own scroll, so a list that grows past the
         viewport scrolls inside it rather than pushing the example off screen. */
      #sidebar {
        flex: 0 0 var(--panel-width); display: flex; flex-direction: column;
        border-right: 1px solid var(--rule); background: var(--surface-solid); overflow: hidden;
      }
      #masthead { padding: var(--space-5) var(--space-5) var(--space-4); }
      #masthead h1 { margin: 0; font-size: var(--text-lg); font-weight: 650; letter-spacing: -0.01em; }
      #masthead p { margin: var(--space-2) 0 0; font-size: var(--text-sm); color: var(--ink-2); }

      /* The generated list (gallery.mjs): the renderer switch, then one entry per
         feature under its section. Nothing in here is written by hand — this
         element is empty as authored and stamped as the shell is served, so a
         page added to the folder appears with no list edited. */
      #examples { flex: 1; overflow-y: auto; padding: 0 var(--space-3) var(--space-5); }
      #renderer, #look {
        display: flex; margin: 0 var(--space-2) var(--space-4); padding: 3px;
        background: var(--sunken); border-radius: var(--radius-sm);
      }
      #renderer button, #look button {
        flex: 1; padding: 5px 0; font: inherit; font-size: var(--text-sm); font-weight: 550; cursor: pointer;
        color: var(--ink-2); background: transparent; border: 0; border-radius: 4px;
      }
      #renderer button[aria-pressed="true"], #look button[aria-pressed="true"] { color: var(--ink); background: var(--surface-solid); box-shadow: var(--shadow); }
      #examples section { margin-top: var(--space-3); }
      #examples h2 {
        margin: 0 var(--space-2) var(--space-1); font-size: var(--text-xs); font-weight: 600;
        letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3);
      }
      #examples ul { margin: 0; padding: 0; list-style: none; }
      #examples a {
        display: block; padding: 5px var(--space-2); border-radius: var(--radius-sm);
        font-size: var(--text-md); color: var(--ink); text-decoration: none;
      }
      #examples a:hover { background: var(--sunken); color: var(--ink); }
      #examples a[aria-current="page"] { background: var(--sunken); color: var(--accent); font-weight: 550; }
      /* The look switch, under the list: chosen once for the whole gallery. */
      #sidebar > #look { margin: var(--space-3) calc(var(--space-3) + var(--space-2)) var(--space-4); }
      #look button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
      #look svg { width: 14px; height: 14px; flex: none; }

      /* ------------------------------------------------------------- stage */
      /* The iframe frames a page, it does not own one: every example works
         opened at its own address, and nothing here is chrome it depends on. */
      #frame { flex: 1; border: 0; width: 100%; height: 100%; background: var(--studio); }

      /* Phone width: the sidebar becomes a short strip above the example,
         capped so it never takes more than a third of the screen. */
      @media (max-width: 700px) {
        body { flex-direction: column; }
        #sidebar { flex: 0 0 auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--rule); }
        #masthead { padding: var(--space-3) var(--space-4) var(--space-2); }
        #masthead p { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div id="masthead">
        <h1>three-vat</h1>
        <p>
          Animation clips baked into a texture and played back on the GPU.
          <a href="https://github.com/MikeFernandez-Pro/three-vat">Source and docs</a>
        </p>
      </div>
      <!-- Empty as authored, and filled as the shell is served: the sidebar is
           generated from the page table (gallery.mjs, ADR-0020, ADR-0037). A list
           written here would be the menu that grows one anchor at a time. -->
      <nav id="examples" aria-label="examples"></nav>
      <!-- The studio's look (look.mjs): the visitor's system's until they
           pick one here, then theirs, remembered for every example. -->
      <div id="look" role="group" aria-label="look">
        <button type="button" data-look="light">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="8" cy="8" r="3" />
            <path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06" />
          </svg>
          Light
        </button>
        <button type="button" data-look="dark">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
            <path d="M13.5 9.6A5.75 5.75 0 0 1 6.4 2.5a5.75 5.75 0 1 0 7.1 7.1Z" />
          </svg>
          Dark
        </button>
      </div>
    </div>
    <iframe id="frame" title="the example you picked"></iframe>

    <script type="module">
      // The shell's own behaviour: which example is framed, and on which
      // renderer. Both read the sidebar rather than a list of their own — an
      // entry names both its pages in `data-webgl` / `data-webgpu`, and the
      // default is whichever entry the generator marked current — so this
      // script never has to be edited when a page lands.
      const frame = document.getElementById('frame')
      const entries = [...document.querySelectorAll('#examples a[data-feature]')]
      const buttons = [...document.querySelectorAll('#renderer button')]
      const renderers = buttons.map((button) => button.dataset.renderer)

      // The switch is remembered, so browsing features keeps a visitor on their
      // renderer, this visit and the next.
      const KEY = 'three-vat:renderer'
      const stored = () => {
        try { return localStorage.getItem(KEY) } catch { return null }
      }
      const remember = (renderer) => {
        try { localStorage.setItem(KEY, renderer) } catch {}
      }
      let renderer = renderers.includes(stored()) ? stored() : renderers[0]

      /** The entry the gallery opens on: the one the sidebar came marked as current. */
      const fallback = entries.find((a) => a.getAttribute('aria-current') === 'page') ?? entries[0]

      /** The entry and renderer a page name stands for, if it is one. */
      const lookup = (page) => {
        for (const entry of entries) {
          for (const r of renderers) if (entry.dataset[r] === page) return { entry, renderer: r }
        }
        return null
      }

      // The framed example lives in the URL, as a page name, so a link into the
      // gallery is shareable and the back button walks the examples someone
      // looked at. A hash naming a page also says which renderer it is on, and
      // that wins over the remembered switch.
      function show() {
        const found = lookup(decodeURIComponent(location.hash.slice(1)))
        if (found) {
          renderer = found.renderer
          remember(renderer)
        }
        const entry = found?.entry ?? fallback
        if (!entry) return
        const src = `${entry.dataset[renderer]}.html`
        // Guarded, so a re-render for any other reason does not reload the
        // example and throw away the crowd it has already baked.
        if (!frame.src.endsWith(`/${src}`)) frame.src = src
        for (const a of entries) {
          // Every entry's href follows the switch, so a middle click opens the
          // page the visitor would have framed.
          a.href = `${a.dataset[renderer]}.html`
          if (a === entry) a.setAttribute('aria-current', 'page')
          else a.removeAttribute('aria-current')
        }
        for (const button of buttons) button.setAttribute('aria-pressed', String(button.dataset.renderer === renderer))
      }

      for (const a of entries) {
        a.addEventListener('click', (event) => {
          // Only the plain left click: a middle click, a modified click or a
          // right click still opens the example at its own address, which it
          // is built to work at.
          if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return
          event.preventDefault()
          location.hash = a.dataset[renderer]
        })
      }

      for (const button of buttons) {
        button.addEventListener('click', () => {
          renderer = button.dataset.renderer
          remember(renderer)
          const current = entries.find((a) => a.getAttribute('aria-current') === 'page') ?? fallback
          // The same feature, on the other renderer — replacing the history
          // entry, because a switch is not a step back through the examples.
          if (current) history.replaceState(null, '', `#${current.dataset[renderer]}`)
          show()
        })
      }

      addEventListener('hashchange', show)
      show()

      // The look, light or dark. The look script stamped first into this head
      // and every example's (look.mjs) has already marked each page with it,
      // from a stored pick or else the system; a pick here is stored under the
      // key that script reads, so an example opened at its own address wears
      // it too.
      const LOOK_KEY = 'three-vat:look'
      const lookButtons = [...document.querySelectorAll('#look button')]
      const system = matchMedia('(prefers-color-scheme: dark)')
      const picked = () => {
        try {
          return ['light', 'dark'].includes(localStorage.getItem(LOOK_KEY))
        } catch {
          return false
        }
      }
      function wear(look) {
        for (const button of lookButtons) button.setAttribute('aria-pressed', String(button.dataset.look === look))
        if (document.documentElement.dataset.look === look) return
        document.documentElement.dataset.look = look
        // The example reads its look once, as it loads, so it loads again in this one.
        frame.contentWindow?.location.reload()
      }
      for (const button of lookButtons) {
        button.addEventListener('click', () => {
          try {
            localStorage.setItem(LOOK_KEY, button.dataset.look)
          } catch {}
          wear(button.dataset.look)
        })
      }
      // Until a visitor picks, the gallery follows their system, while it is open too.
      system.addEventListener('change', () => {
        if (!picked()) wear(system.matches ? 'dark' : 'light')
      })
      wear(document.documentElement.dataset.look)
    </script>
  </body>
</html>

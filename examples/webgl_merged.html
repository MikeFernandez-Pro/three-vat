<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-vat — WebGL merge materials into one draw</title>
    <meta name="three-vat:section" content="Baking" />
    <meta
      name="description"
      content="RobotExpressive baked with mergeFlatMaterials: true, its three flat-coloured materials collapsed into one, and the crowd drawing once instead of three times — the draw calls measured, on WebGLRenderer."
    />
    <link rel="stylesheet" href="./src/theme.css" />
  </head>
  <body>
    <!-- The page's text: a title, one sentence saying what to try, and the
         readouts the feature is evidenced by (ADR-0037). The way back to the
         gallery follows the title, stamped in as the page is served. -->
    <div id="hud">
      <h1 id="title">Merge materials into one draw</h1>
      <p id="try">Tint by draw call, then switch the merge off: one draw becomes three.</p>
      <p id="api"><code>bakeVAT({ mergeFlatMaterials: true })</code></p>
      <dl id="readouts">
        <div><dt>materials</dt><dd id="materials">—</dd></div>
        <div><dt>VAT draw calls</dt><dd id="draw-count">—</dd></div>
      </dl>
      <!-- Read off the bake: each material, its colour, and the draw it costs. -->
      <div id="swatches"></div>
    </div>
    <script type="module" src="/src/webgl_merged.ts"></script>
  </body>

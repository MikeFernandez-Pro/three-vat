<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-vat — WebGPU Soldier crowd, rig-encoded</title>
    <meta
      name="description"
      content="A crowd of skinned Soldiers from one baked VAT on WebGPURenderer and the TSL decode path. Flip between the vertex and rig encodings and watch the HUD's texture memory and bake time change."
    />
    <style>
      body { margin: 0; overflow: hidden; font-family: ui-monospace, Consolas, monospace; background: linear-gradient(to bottom, #8ec8ea, #e8d5b0); }
      canvas { display: block; }

      /* The HUD carries the example's whole argument, so it is on screen at
         rest, top-left, clear of the texture panel on the right (ADR-0012).
         Its readouts are the ones this page's feature is evidenced by and no
         others (ADR-0020): the toggle moves the texture's width, its memory
         and the wait at load, so those are here — and the draw calls, which
         the toggle cannot move, belong to the crowd pages instead. The WebGL
         Soldier carries exactly these, readout for readout; the release suite
         holds the pair to it. */
      #hud {
        position: fixed; top: 12px; left: 14px; z-index: 1;
        /* Everything the texture panel claims on the right, given back: the
           same strip expression it sizes itself with (src/texture-panel.ts),
           plus both margins. The two never overlap at any width. */
        max-width: min(46ch, calc(100vw - (min(78px, 13vw) * 2 + 40px)));
        color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      #hud #title { font-size: 15px; font-weight: bold; }

      /* The page's whole evidence, and so not the quiet aside it is where a
         crowd's cost is the point: the line the toggle rewrites is given the
         HUD's own size, directly under the title. */
      #vat { font-size: 13px; line-height: 1.5; margin-top: 10px; }

      /* The control panel lives in this column too, directly under the readout
         its toggle rewrites. It brings its own type and chrome, so the HUD's
         text shadow stops here, and the column scrolls rather than running off
         a short viewport. */
      #hud { max-height: calc(100vh - 24px); overflow-y: auto; scrollbar-width: none; }
      #hud::-webkit-scrollbar { display: none; }
      #hud .lil-gui { text-shadow: none; margin-top: 12px; }

      /* Phone width: the slider panel and the texture strips already shrink
         themselves, so the HUD only has to stop shouting over them. */
      @media (max-width: 600px) {
        #hud { top: 8px; left: 10px; }
        #hud #title { font-size: 13px; }
        #vat { font-size: 11px; }
      }

      /* The no-WebGPU notice: markup here, revealed by the page's door
         (src/webgpu_soldier.ts), so the fallback needs no renderer to render.
         The door hides the HUD as it reveals this: a draw-call readout above a
         page that never drew a frame would be the one lie this page cannot
         afford. */
      #unsupported {
        position: fixed; inset: 0; z-index: 2; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        gap: 10px; padding: 24px; text-align: center; color: #17202a;
      }
      /* `display: flex` above outranks the browser's own `[hidden] { display:
         none }`, so the attribute alone would leave the notice on screen over
         a working crowd. Said explicitly. */
      #unsupported[hidden] { display: none; }
      #unsupported h1 { font-size: 18px; margin: 0; }
      #unsupported p { font-size: 13px; line-height: 1.6; margin: 0; max-width: 42ch; opacity: 0.85; }
      #unsupported a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="hud">
      <!-- The example's pair — the same example on the GLSL path — and the way
           home to the demo follow the title as the navigation strip, stamped in
           as the page is served (nav.mjs, ADR-0019) rather than written here. -->
      <div id="title">three-vat on WebGPU · Soldier</div>
      <div id="vat">baking both encodings…</div>
    </div>
    <div id="unsupported" hidden>
      <h1>This example needs WebGPU</h1>
      <p id="reason"></p>
      <p>
        <a href="webgl_soldier.html">Open the WebGL Soldier crowd instead →</a>
      </p>
      <p>Same crowd, same two bakes, decoded in GLSL rather than TSL — one import line apart.</p>
    </div>
    <script type="module" src="/src/webgpu_soldier.ts"></script>
  </body>
</html>

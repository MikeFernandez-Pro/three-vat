<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-vat — WebGPU robot crowd</title>
    <meta
      name="description"
      content="Drag one slider from 1 robot to 340, all animating on the GPU from one baked VAT, drawn through WebGPURenderer and the TSL decode path."
    />
    <style>
      body { margin: 0; overflow: hidden; font-family: ui-monospace, Consolas, monospace; background: linear-gradient(to bottom, #8ec8ea, #e8d5b0); }
      canvas { display: block; }

      /* The HUD carries the demo's whole argument, so it is on screen at rest,
         top-left, clear of the texture panel on the right (ADR-0012). */
      #hud {
        position: fixed; top: 12px; left: 14px; z-index: 1;
        /* Everything the texture panel claims on the right, given back: the
           same strip expression it sizes itself with (src/texture-panel.ts),
           plus both margins. The two never overlap at any width. */
        max-width: min(46ch, calc(100vw - (min(78px, 13vw) * 2 + 40px)));
        color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      #hud #title { font-size: 15px; font-weight: bold; }

      /* The one number given visual emphasis — because it is the one that is
         supposed to bore you. Everything else in the HUD is deliberately
         quieter than it. */
      #draws { margin-top: 10px; display: flex; align-items: baseline; gap: 8px; }
      #draws #draw-count { font-size: 38px; font-weight: bold; line-height: 1; }
      #draws #draw-label { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.9; }
      #draws-note { font-size: 11px; opacity: 0.75; margin-top: 3px; }

      #info, #vat { font-size: 12px; opacity: 0.85; margin-top: 8px; }
      #vat { opacity: 0.75; }

      /* The control panel lives in this column too, directly under the numbers
         it moves. It brings its own type and chrome, so the HUD's text shadow
         stops here, and the column scrolls rather than running off a short
         viewport. */
      #hud { max-height: calc(100vh - 24px); overflow-y: auto; scrollbar-width: none; }
      #hud::-webkit-scrollbar { display: none; }
      #hud .lil-gui { text-shadow: none; margin-top: 12px; }

      /* Phone width: the slider panel and the texture strips already shrink
         themselves, so the HUD only has to stop shouting over them. */
      @media (max-width: 600px) {
        #hud { top: 8px; left: 10px; }
        #hud #title { font-size: 13px; }
        #draws #draw-count { font-size: 28px; }
        #draws #draw-label { font-size: 11px; }
        #info, #vat, #draws-note { font-size: 10px; }
      }

      /* The no-WebGPU notice: markup here, revealed by the page's door
         (src/webgpu_crowd.ts), so the fallback needs no renderer to render.
         The door hides the HUD as it reveals this: a draw-call readout above a
         page that never drew a frame would be the one lie this demo cannot
         afford. */
      #unsupported {
        position: fixed; inset: 0; z-index: 2; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        gap: 10px; padding: 24px; text-align: center; color: #17202a;
      }
      #unsupported h1 { font-size: 18px; margin: 0; }
      #unsupported p { font-size: 13px; line-height: 1.6; margin: 0; max-width: 42ch; opacity: 0.85; }
      #unsupported a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="hud">
      <!-- The way back to the root — the WebGL demo itself, the same crowd on
           the GLSL decode path — and to every example follows the title as the
           navigation strip, stamped in as the page is served (nav.mjs,
           ADR-0019) rather than written here. -->
      <div id="title">three-vat on WebGPU</div>
      <div id="draws">
        <span id="draw-count">—</span><span id="draw-label">draw calls</span>
      </div>
      <div id="draws-note">baking…</div>
      <div id="info"></div>
      <div id="vat"></div>
    </div>
    <div id="unsupported" hidden>
      <h1>This demo needs WebGPU</h1>
      <p id="reason"></p>
      <p>
        <a href="index.html">Open the WebGL crowd instead →</a>
      </p>
      <p>Same crowd, same baked VAT, decoded in GLSL rather than TSL — one import line apart.</p>
    </div>
    <script type="module" src="/src/webgpu_crowd.ts"></script>
  </body>
</html>

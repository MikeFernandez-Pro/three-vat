<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-vat — WebGPU robot crowd</title>
    <meta
      name="description"
      content="Drag one slider from 1 robot to 340, all animating on the GPU from one baked VAT, drawn through WebGPURenderer and the TSL decode path."
    />
    <style>
      /* threejs.org/examples/main.css, rule for rule, plus the one rule the example
         this layout is taken from (webgl_batch_lod_bvh) adds to it (ADR-0024). */
      body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: Monospace; font-size: 13px; line-height: 24px; overscroll-behavior: none; }
      a { color: #ff0; text-decoration: underline; }
      a:hover { text-decoration: underline; }
      button { cursor: pointer; text-transform: uppercase; }
      canvas { display: block; }

      /* three's #info, and the layout of every three example: the readouts centred
         at the top, the frame timings top-left, the controls top-right (ADR-0024).
         The readouts are the ones this page's feature is evidenced by and no others
         (ADR-0020); the pair carries the same ones, readout for readout, and the
         release suite holds it to that. */
      #hud {
        position: absolute; top: 0px; width: 100%; padding: 10px; box-sizing: border-box;
        text-align: center; -moz-user-select: none; -webkit-user-select: none; -ms-user-select: none; user-select: none;
        pointer-events: none; z-index: 1;
      }
      a, button, input, select { pointer-events: auto; }
      /* A column, not the full width: the readouts wrap between the overlay and the
         controls rather than running under them. */
      #hud > * { max-width: 64ch; margin-left: auto; margin-right: auto; }
      /* The way back to the gallery (stamped in by gallery.mjs) follows the title on
         its line, as three's own link opens an example's first line. */
      #hud #title { display: inline; }
      .lil-gui { z-index: 2 !important; }
      @media all and ( max-width: 640px ) {
        .lil-gui.root { right: auto; top: auto; max-height: 50%; max-width: 80%; bottom: 0; left: 0; }
      }

      /* The number the page is about, bold and in line: it is supposed to bore you
         while the count beside it climbs. */
      #draws { display: flex; justify-content: center; align-items: baseline; gap: 6px; }
      #draws #draw-count { font-weight: bold; }
      #draws #draw-label { text-transform: uppercase; opacity: 0.9; }
      #draws-note { opacity: 0.75; }

      /* The no-WebGPU notice: markup here, revealed by the page's door
         (src/webgpu_crowd.ts), so the fallback needs no renderer to render.
         The door hides the HUD as it reveals this: a draw-call readout above a
         page that never drew a frame would be the one lie this demo cannot
         afford. */
      #unsupported {
        position: fixed; inset: 0; z-index: 2; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        gap: 10px; padding: 24px; text-align: center; color: #fff;
      }
      /* `display: flex` above outranks the browser's own `[hidden] { display:
         none }`, so the attribute alone would leave the notice on screen over
         a working crowd. Said explicitly. */
      #unsupported[hidden] { display: none; }
      #unsupported h1 { font-size: 18px; margin: 0; }
      #unsupported p { font-size: 13px; line-height: 1.6; margin: 0; max-width: 42ch; opacity: 0.85; }
    </style>
  </head>
  <body>
    <div id="hud">
      <!-- The way back to the gallery follows the title, stamped in as the page
           is served (gallery.mjs, ADR-0020) rather than written here. It is the
           only chrome this page carries: opened at its own address, with no
           shell around it, this page works exactly as it does inside the
           frame. -->
      <div id="title">three-vat on WebGPU</div>
      <div id="draws">
        <span id="draw-count">—</span><span id="draw-label">draw calls</span>
      </div>
      <div id="draws-note">baking…</div>
      <div id="info"></div>
    </div>
    <div id="unsupported" hidden>
      <h1>This demo needs WebGPU</h1>
      <p id="reason"></p>
      <p>
        <a href="webgl_crowd.html">Open the WebGL crowd instead →</a>
      </p>
      <p>Same crowd, same baked VAT, decoded in GLSL rather than TSL — one import line apart.</p>
    </div>
    <script type="module" src="/src/webgpu_crowd.ts"></script>
  </body>
</html>
